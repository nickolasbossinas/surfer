# Run from this directory (settings: copy .env.example to .env):
#   docker compose up -d --build                     start the server
#   docker compose run --rm android-builder          build the tablet app (server must have run once)
#   docker compose run --rm android-builder-x10      build the Android 2.x app (needs LEGACY_PORT)

name: surfer

services:
  surfer:
    build: ./server
    image: surfer-server
    container_name: surfer
    init: true
    restart: unless-stopped
    shm_size: 1gb
    mem_limit: ${SURFER_MEM_LIMIT:-6g}
    security_opt:
      # Docker's default profile plus clone/unshare/setns for Chromium's sandbox.
      - seccomp=./server/seccomp-chromium.json
    ports:
      - "${SURFER_PORT:-8686}:8686" # app connection (wss)
      - "${SURFER_INSTALL_PORT:-8687}:8687" # app download (http, APK only)
      - "${SURFER_LEGACY_PORT:-8688}:8688" # Android 2.x app connection (TLS 1.0), when LEGACY_PORT is set
    volumes:
      - surfer-data:/data
    environment:
      IDLE_STOP_MIN: ${IDLE_STOP_MIN:-30}
      ACCEPT_LANGUAGE: ${ACCEPT_LANGUAGE:-en-US,en} # comma list, no q-values (Chromium adds them)
      IDLE_FORMAT: ${IDLE_FORMAT:-png}
      DEBUG_CLIENT: ${DEBUG_CLIENT:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 0 turns off the APK download port.
      INSTALL_PORT: ${INSTALL_PORT:-8687}
      # 8688 turns on the TLS 1.0 port for the Android 2.x app; 0 keeps it off.
      LEGACY_PORT: ${LEGACY_PORT:-0}

  android-builder: &builder
    build: ./android-builder
    image: surfer-android-builder
    profiles: [build]
    environment:
      # The port the apps use when the server address is typed without one.
      SURFER_DEFAULT_PORT: ${SURFER_PORT:-8686}
      SURFER_LEGACY_DEFAULT_PORT: ${SURFER_LEGACY_PORT:-8688}
    volumes:
      - ./android:/src:ro
      - ./android-x10:/src-x10:ro
      - surfer-data:/data
      - android-keystore:/keystore
      - gradle-cache:/home/ubuntu/.gradle

  android-builder-x10:
    <<: *builder
    environment:
      SURFER_APP: x10
      SURFER_LEGACY_DEFAULT_PORT: ${SURFER_LEGACY_PORT:-8688}

volumes:
  surfer-data:
  android-keystore:
  gradle-cache:
