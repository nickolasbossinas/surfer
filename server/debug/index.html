<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surfer debug client</title>
<style>
  :root { color-scheme: light dark; --bar: #f2f2f2; --border: #ccc; --text: #222; }
  @media (prefers-color-scheme: dark) { :root { --bar: #2a2a2a; --border: #444; --text: #eee; } }
  html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; color: var(--text); background: #111; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #bar { display: flex; gap: 6px; padding: 6px; background: var(--bar); border-bottom: 1px solid var(--border); align-items: center; }
  #bar button { min-width: 32px; }
  #url { flex: 1; min-width: 0; padding: 4px 6px; }
  #tabs { max-width: 220px; }
  #stage { flex: 1; position: relative; overflow: hidden; }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; outline: none; background: #fff; }
  #status { padding: 2px 8px; font: 12px ui-monospace, monospace; background: var(--bar); border-top: 1px solid var(--border); white-space: nowrap; overflow: hidden; }
  #loading { position: absolute; top: 0; left: 0; height: 3px; background: #1a73e8; width: 0; transition: width .2s; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button id="back" title="Back">◀</button>
    <button id="forward" title="Forward">▶</button>
    <button id="reload" title="Reload">⟳</button>
    <input id="url" type="text" placeholder="Address or search" autocomplete="off" spellcheck="false">
    <select id="tabs" title="Tabs"></select>
    <button id="newTab" title="New tab">＋</button>
    <button id="closeTab" title="Close tab">✕</button>
    <button id="forget" title="Clear browsing data (new empty session)">⌫</button>
  </div>
  <div id="stage">
    <canvas id="screen" tabindex="0"></canvas>
    <div id="loading"></div>
  </div>
  <div id="status">connecting…</div>
</div>
<script src="client.js"></script>
</body>
</html>
